<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-950: #051a13;
    --green-900: #0b3d2e;
    --green-800: #114d3a;
    --green-700: #17614a;
    --green-600: #1d7a5c;
    --gold: #d4af37;
    --gold-light: #f5dd8f;
    --gold-dim: #a3873a;
    --gold-shine: linear-gradient(100deg, #a3873a 0%, #d4af37 22%, #fff6d9 45%, #f5dd8f 55%, #d4af37 78%, #a3873a 100%);
    --cream: #f5f0e1;
    --red: #b3382c;
    --font-display: 'Cinzel', serif;
    --font-body: 'Inter', 'Segoe UI', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: #04140e;
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* animated ambient background */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, #143f2d 0%, transparent 60%),
      radial-gradient(circle at 50% 100%, #0d2e22 0%, transparent 55%),
      linear-gradient(180deg, var(--green-950), #041209 55%, #010a06 100%);
  }

  .bg-grid {
    position: absolute;
    inset: -1px;
    background-image:
      repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.16) 0, rgba(212, 175, 55, 0.16) 1.5px, transparent 1.5px, transparent 46px),
      repeating-linear-gradient(-45deg, rgba(212, 175, 55, 0.16) 0, rgba(212, 175, 55, 0.16) 1.5px, transparent 1.5px, transparent 46px);
    -webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 20%, black 35%, transparent 100%);
    mask-image: radial-gradient(ellipse 90% 90% at 50% 20%, black 35%, transparent 100%);
    animation: gridDrift 40s linear infinite;
  }

  @keyframes gridDrift {
    from { background-position: 0 0, 0 0; }
    to { background-position: 65px 0, -65px 0; }
  }

  .bg-sweep {
    position: absolute;
    inset: -20%;
    background: linear-gradient(115deg, transparent 40%, rgba(212, 175, 55, 0.06) 48%, rgba(212, 175, 55, 0.1) 50%, rgba(212, 175, 55, 0.06) 52%, transparent 60%);
    animation: sweepMove 9s ease-in-out infinite;
  }

  @keyframes sweepMove {
    0%, 100% { transform: translateX(-25%) translateY(-10%); }
    50% { transform: translateX(15%) translateY(10%); }
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.65;
    will-change: transform;
  }

  .orb-1 {
    width: 560px;
    height: 560px;
    top: -160px;
    left: -140px;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.5), transparent 70%);
    animation: driftA 24s ease-in-out infinite alternate;
  }

  .orb-2 {
    width: 640px;
    height: 640px;
    bottom: -240px;
    right: -180px;
    background: radial-gradient(circle, rgba(29, 122, 92, 0.65), transparent 70%);
    animation: driftB 28s ease-in-out infinite alternate;
  }

  .orb-3 {
    width: 460px;
    height: 460px;
    top: 38%;
    left: 55%;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.3), transparent 70%);
    animation: driftC 20s ease-in-out infinite alternate;
  }

  .orb-4 {
    width: 360px;
    height: 360px;
    bottom: 8%;
    left: -80px;
    background: radial-gradient(circle, rgba(23, 97, 74, 0.55), transparent 70%);
    animation: driftD 26s ease-in-out infinite alternate;
  }

  @keyframes driftD {
    0% { transform: translate(0, 0) scale(0.95); }
    100% { transform: translate(80px, -40px) scale(1.15); }
  }

  @keyframes driftA {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(70px, 50px) scale(1.18); }
  }

  @keyframes driftB {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-60px, -70px) scale(1.12); }
  }

  @keyframes driftC {
    0% { transform: translate(0, 0) scale(0.9); opacity: 0.35; }
    100% { transform: translate(-90px, 60px) scale(1.1); opacity: 0.6; }
  }

  /* ===== GOLD SHIMMER ===== */
  .gold-shine {
    background-image: var(--gold-shine);
    background-size: 250% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    to { background-position: -250% center; }
  }

  /* ===== SPLASH SCREEN ===== */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: radial-gradient(circle at 50% 40%, #0d3527 0%, var(--green-950) 60%, #020c08 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    overflow: hidden;
  }

  #splash::before,
  #splash::after {
    content: '';
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.16) 0%, transparent 70%);
    animation: pulseGlow 4s ease-in-out infinite;
  }

  #splash::before { top: -140px; left: -140px; }
  #splash::after { bottom: -140px; right: -140px; animation-delay: 1.5s; }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(0.85); opacity: 0.5; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  .splash-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .splash-particles span {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold-light);
    opacity: 0;
    box-shadow: 0 0 8px 2px rgba(245, 221, 143, 0.6);
    animation: floatParticle 6s ease-in-out infinite;
  }

  @keyframes floatParticle {
    0% { opacity: 0; transform: translateY(0); }
    15% { opacity: 0.85; }
    85% { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-140px); }
  }

  .splash-frame {
    position: absolute;
    inset: 26px;
    border: 1px solid rgba(212, 175, 55, 0.22);
    border-radius: 2px;
  }

  .splash-frame::before,
  .splash-frame::after {
    content: '';
    position: absolute;
    width: 34px;
    height: 34px;
    border: 2px solid var(--gold);
  }

  .splash-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .splash-frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

  #splash.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #splash .rays {
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(212,175,55,0.06) 8deg, transparent 16deg);
    animation: rotateRays 18s linear infinite;
  }

  @keyframes rotateRays {
    to { transform: rotate(360deg); }
  }

  .crest-wrap {
    position: relative;
    width: 250px;
    height: 244px;
    filter: drop-shadow(0 0 34px rgba(212, 175, 55, 0.5));
  }

  .crest-wrap::before {
    content: '';
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(212, 175, 55, 0.35);
    animation: ringPulse 3s ease-in-out infinite;
  }

  @keyframes ringPulse {
    0%, 100% { transform: scale(0.94); opacity: 0.35; }
    50% { transform: scale(1.04); opacity: 0.9; }
  }

  .crest-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.4) rotate(-10deg);
    animation: crestReveal 1s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes crestReveal {
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .splash-title {
    font-family: var(--font-display);
    font-weight: 900;
    letter-spacing: 8px;
    font-size: 2.3em;
    text-shadow: 0 4px 18px rgba(212,175,55,0.35);
    opacity: 0;
    animation: fadeUp 0.8s ease-out 1.5s forwards, shine 4s linear 2.3s infinite;
    text-align: center;
  }

  .splash-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 220px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 1.65s forwards;
  }

  .splash-divider span {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }

  .splash-divider span:last-child {
    background: linear-gradient(90deg, var(--gold), transparent);
  }

  .splash-divider .diamond {
    flex: none;
    width: 7px;
    height: 7px;
    background: var(--gold-light);
    transform: rotate(45deg);
    box-shadow: 0 0 10px rgba(245, 221, 143, 0.7);
  }

  .splash-sub {
    font-family: var(--font-body);
    letter-spacing: 4px;
    font-size: 0.95em;
    color: var(--cream);
    opacity: 0;
    text-transform: uppercase;
    animation: fadeUp 0.8s ease-out 1.75s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .splash-bar {
    width: 220px;
    height: 3px;
    background: rgba(212,175,55,0.15);
    border-radius: 3px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 2s forwards;
  }

  .splash-bar::after {
    content: '';
    display: block;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-light), var(--gold-dim));
    animation: barSlide 1.1s ease-in-out infinite;
  }

  @keyframes barSlide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ===== HEADER ===== */
  header {
    position: relative;
    z-index: 1;
    background: linear-gradient(90deg, rgba(5, 26, 19, 0.9), rgba(17, 77, 58, 0.85));
    border-bottom: 1px solid rgba(212,175,55,0.5);
    padding: 22px 20px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    animation: slideDown 0.7s ease-out;
  }

  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .header-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-direction: column;
    text-align: center;
  }

  .logo-blason {
    width: 62px;
    height: 60px;
    flex-shrink: 0;
    filter: drop-shadow(0 3px 10px rgba(212,175,55,0.4));
    animation: floatLogo 5s ease-in-out infinite;
  }

  .logo-blason img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  @keyframes floatLogo {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(-2deg); }
  }

  .header-text h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.7em;
    letter-spacing: 2px;
    background-image: var(--gold-shine);
    background-size: 250% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    animation: shine 5s linear infinite;
  }

  .header-text p {
    color: var(--cream);
    font-size: 0.95em;
    opacity: 0.75;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* ===== NAV ===== */
  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(5, 20, 15, 0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 20px;
    border-bottom: 1px solid rgba(212,175,55,0.25);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  nav button {
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    border: 1.5px solid rgba(212, 175, 55, 0.55);
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.88em;
    font-weight: 700;
    letter-spacing: 0.6px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  nav button:hover {
    background: rgba(212, 175, 55, 0.15);
    border-color: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(212, 175, 55, 0.25);
  }

  nav button.active {
    background-image: var(--gold-shine);
    background-size: 250% auto;
    animation: shine 5s linear infinite;
    color: var(--green-950);
    border-color: var(--gold-light);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(212, 175, 55, 0.45);
  }

  /* ===== MAIN ===== */
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  .fade-in { animation: fadeIn 0.6s ease-out both; }

  #content > .fade-in:nth-child(1) { animation-delay: 0s; }
  #content > .fade-in:nth-child(2) { animation-delay: 0.08s; }
  #content > .fade-in:nth-child(3) { animation-delay: 0.16s; }
  #content > .fade-in:nth-child(4) { animation-delay: 0.24s; }
  #content > .fade-in:nth-child(5) { animation-delay: 0.32s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .match-card { animation: fadeIn 0.45s ease-out both; }
  .match-card:nth-of-type(2) { animation-delay: 0.05s; }
  .match-card:nth-of-type(3) { animation-delay: 0.1s; }
  .match-card:nth-of-type(4) { animation-delay: 0.15s; }
  .match-card:nth-of-type(5) { animation-delay: 0.2s; }
  .match-card:nth-of-type(n+6) { animation-delay: 0.25s; }

  tbody tr { animation: fadeIn 0.4s ease-out both; }
  tbody tr:nth-child(2) { animation-delay: 0.05s; }
  tbody tr:nth-child(3) { animation-delay: 0.1s; }
  tbody tr:nth-child(4) { animation-delay: 0.15s; }
  tbody tr:nth-child(n+5) { animation-delay: 0.2s; }

  .card {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(212, 175, 55, 0.28);
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 22px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  .card:hover {
    border-color: rgba(212, 175, 55, 0.55);
    box-shadow: 0 14px 45px rgba(212, 175, 55, 0.15);
  }

  .card h2 {
    font-family: var(--font-display);
    font-size: 1.4em;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    letter-spacing: 0.5px;
    background-image: var(--gold-shine);
    background-size: 250% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shine 5s linear infinite;
  }

  .card h3 {
    color: var(--gold-light);
    font-size: 1.1em;
    font-weight: 700;
    margin: 20px 0 14px;
    letter-spacing: 0.5px;
  }

  .groups-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  @media (max-width: 900px) {
    .groups-grid { grid-template-columns: 1fr; }
    .header-text h1 { font-size: 1.25em; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 0.92em;
  }

  thead { background: rgba(212, 175, 55, 0.1); }

  th {
    color: var(--gold);
    padding: 10px 8px;
    text-align: left;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.78em;
    letter-spacing: 0.5px;
    border-bottom: 2px solid rgba(212,175,55,0.5);
  }

  td { padding: 10px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  tbody tr { transition: background 0.2s ease; }
  tbody tr:hover { background: rgba(212, 175, 55, 0.06); }
  tbody tr:first-child td { color: var(--gold-light); font-weight: 700; }

  .match-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-left: 3px solid var(--gold-dim);
    border-radius: 10px;
    padding: 15px 18px;
    margin: 10px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    transition: all 0.25s ease;
  }

  .match-card:hover {
    background: rgba(212, 175, 55, 0.08);
    border-left-color: var(--gold);
    transform: translateX(4px);
  }

  .match-teams {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 15px;
    font-weight: 600;
    flex-wrap: wrap;
  }

  .score {
    background: var(--green-950);
    border: 1.5px solid var(--gold);
    color: var(--gold-light);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 1.15em;
    font-weight: 700;
    min-width: 70px;
    text-align: center;
  }

  .match-info {
    text-align: right;
    font-size: 0.85em;
    color: #ffffff;
    opacity: 0.92;
  }

  .login-box {
    max-width: 420px;
    margin: 40px auto;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 18px;
    padding: 40px 36px;
    backdrop-filter: blur(10px);
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
  }

  .login-box .lock-icon {
    width: 46px; height: 46px;
    margin: 0 auto 18px;
    color: var(--gold);
  }

  .login-box h2 {
    font-family: var(--font-display);
    color: var(--gold-light);
    margin-bottom: 24px;
    font-size: 1.5em;
    border: none;
    padding: 0;
  }

  .form-group { margin-bottom: 18px; text-align: left; }

  .form-group label {
    display: block;
    color: var(--gold-light);
    margin-bottom: 7px;
    font-weight: 600;
    font-size: 0.9em;
  }

  input, select, textarea {
    width: 100%;
    padding: 11px 14px;
    background: rgba(2, 12, 8, 0.55);
    border: 1.5px solid rgba(212, 175, 55, 0.35);
    border-radius: 8px;
    color: var(--cream);
    font-size: 0.95em;
    transition: all 0.25s ease;
    font-family: inherit;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18);
  }

  button {
    position: relative;
    overflow: hidden;
    padding: 11px 22px;
    background-image: var(--gold-shine);
    background-size: 250% auto;
    background-position: 0% center;
    color: var(--green-950);
    border: none;
    border-radius: 8px;
    font-size: 0.9em;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.25s ease, background-position 0.6s ease;
    box-shadow: 0 5px 16px rgba(212, 175, 55, 0.25);
    font-family: var(--font-body);
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(212, 175, 55, 0.4);
    background-position: -120% center;
  }

  button:active { transform: translateY(0); }

  .admin-section {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(212, 175, 55, 0.18);
    border-radius: 12px;
    padding: 20px;
    margin: 18px 0;
  }

  .form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .form-row input, .form-row select { flex: 1; min-width: 150px; }

  .team-item {
    background: rgba(212, 175, 55, 0.04);
    border: 1px solid rgba(212, 175, 55, 0.18);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // AGGRESSIVE VERSION CHECK - forces refresh on all devices
    const CURRENT_VERSION = '20260802-v3';
    const STORAGE_KEY = 'santulhao_version';

    // Clear old storage keys
    localStorage.removeItem('santulhao_page_version');

    // Check version
    const storedVersion = localStorage.getItem(STORAGE_KEY);
    console.log('Stored version:', storedVersion, 'Current:', CURRENT_VERSION);

    if (storedVersion && storedVersion !== CURRENT_VERSION) {
      console.log('Version mismatch! Force reload...');
      localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
      localStorage.clear(); // Clear all caches
      setTimeout(() => {
        window.location.href = window.location.href.split('?')[0] + '?nocache=' + Date.now();
      }, 100);
    } else {
      localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
    }

    // Also force a fetch to verify we have latest HTML
    fetch(window.location.href, { cache: 'no-store' }).catch(() => {})

    let db, state = { session: null, teams: [], matches: [], tab: 'calendar', loading: true, selectedMatchForGoals: null };
    // Force calendar as default tab
    const DEFAULT_TAB = 'calendar';
    const ADMIN_PASSWORD = 'Santulhao.7';

    function hideSplash() {
      const splash = document.getElementById('splash');
      if (splash) splash.classList.add('hidden');
    }

    // Splash is purely decorative — always dismiss on its own timer,
    // completely independent of network/data loading so it can never hang.
    setTimeout(hideSplash, 3200);

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
      ]);
    }

    async function autoGenerateSemis() {
      const groupMatches = state.matches.filter(m => m.stage === 'group');
      const semis = state.matches.filter(m => m.stage === 'semi');

      if (groupMatches.length === 0 || semis.length > 0) return;

      const allGroupsDone = groupMatches.every(m => m.played || (m.goals && m.goals.length > 0));
      if (!allGroupsDone) return;

      const sa = computeStandings(state.teams, state.matches, 'A');
      const sb = computeStandings(state.teams, state.matches, 'B');

      if (sa.length < 2 || sb.length < 2) return;

      try {
        await db.from('matches').insert([
          { stage: 'semi', semi_slot: 'semi1', team1_id: sa[0].team.id, team2_id: sb[1].team.id, placeholder1: '1º A', placeholder2: '2º B' },
          { stage: 'semi', semi_slot: 'semi2', team1_id: sb[0].team.id, team2_id: sa[1].team.id, placeholder1: '1º B', placeholder2: '2º A' }
        ]);
        await loadData();
      } catch (e) {}
    }

    async function autoGenerateFinal() {
      const semi1 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi1');
      const semi2 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi2');
      const final = state.matches.find(m => m.stage === 'final');

      if (!semi1 || !semi2 || final) return;

      const semi1Score1 = (semi1.goals || []).filter(g => g.team_id === semi1.team1_id).length || 0;
      const semi1Score2 = (semi1.goals || []).filter(g => g.team_id === semi1.team2_id).length || 0;
      const semi2Score1 = (semi2.goals || []).filter(g => g.team_id === semi2.team1_id).length || 0;
      const semi2Score2 = (semi2.goals || []).filter(g => g.team_id === semi2.team2_id).length || 0;

      if ((semi1Score1 === 0 && semi1Score2 === 0) || (semi2Score1 === 0 && semi2Score2 === 0)) return;
      if (semi1Score1 === semi1Score2 || semi2Score1 === semi2Score2) return;

      const winner1 = semi1Score1 > semi1Score2 ? semi1.team1_id : semi1.team2_id;
      const loser1 = semi1Score1 > semi1Score2 ? semi1.team2_id : semi1.team1_id;
      const winner2 = semi2Score1 > semi2Score2 ? semi2.team1_id : semi2.team2_id;
      const loser2 = semi2Score1 > semi2Score2 ? semi2.team2_id : semi2.team1_id;

      try {
        await db.from('matches').insert([
          { stage: 'final', team1_id: winner1, team2_id: winner2, placeholder1: 'Vencedor SF1', placeholder2: 'Vencedor SF2' },
          { stage: 'third_place', team1_id: loser1, team2_id: loser2, placeholder1: 'Perdedor SF1', placeholder2: 'Perdedor SF2' }
        ]);
        await loadData();
      } catch (e) {}
    }

    async function init() {
      // Render nav + a visible loading state immediately — never block the UI on the network.
      renderNav();
      render();

      document.getElementById('admin-access')?.addEventListener('click', () => {
        state.tab = 'admin';
        renderNav();
        render();
      });

      let attempts = 0;
      while (!window.supabase && attempts < 20) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
      }

      if (!window.supabase) {
        state.loading = false;
        document.getElementById('content').innerHTML = '<div class="card"><p class="empty-hint">⚠ Erro ao carregar. Recarregue a página.</p></div>';
        return;
      }

      try {
        db = window.supabase.createClient(
          'https://bwseriegvtvjidbacwsa.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3c2VyaWVndnR2amlkYmFjd3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzQwOTEsImV4cCI6MjEwMTI1MDA5MX0.fiddoMRn4I0E8gXwd6FMsa25xBW4i-_w5MmTfyCw6Ac'
        );

        const session = await withTimeout(db.auth.getSession(), 8000);
        state.session = session.data.session;

        db.auth.onAuthStateChange((_evt, sess) => {
          state.session = sess;
          renderNav();
          render();
        });

        await withTimeout(loadData(), 8000);

        db.channel('changes')
          .on('postgres_changes', { event: '*', schema: 'public' }, async () => {
            await loadData();
            await autoGenerateSemis();
            await autoGenerateFinal();
            // Only re-render if not in goals panel
            if (state.selectedMatchForGoals && document.getElementById('goals-panel')?.style.display === 'block') {
              selectMatchForGoals(state.selectedMatchForGoals);
            } else {
              render();
            }
          })
          .subscribe();
      } catch (e) {
        console.error('Erro ao inicializar:', e);
      } finally {
        state.loading = false;
        renderNav();
        render();
      }
    }

    async function loadData() {
      const [teams, matches] = await Promise.all([
        db.from('teams').select('*, players(*)').order('group_name').order('name'),
        db.from('matches').select('*, team1:team1_id(id,name,group_name), team2:team2_id(id,name,group_name), goals(id, player_id, team_id, players(id,name))').order('stage').order('scheduled_at', { ascending: true, nullsFirst: false })
      ]);
      state.teams = teams.data || [];
      state.matches = matches.data || [];
    }

    function renderNav() {
      const tabs = [
        { id: 'calendar', label: '📅 Calendário' },
        { id: 'standings', label: '📊 Classificação' },
        { id: 'bracket', label: '🏅 Fase Final' },
        { id: 'scorers', label: '⚽ Marcadores' }
      ];

      // Only show teams tab if we have teams
      if (state.teams.length > 0) {
        tabs.push({ id: 'teams', label: '👥 Equipas' });
      }

      tabs.push({ id: 'admin', label: '🔐 Admin' });

      let html = '';
      tabs.forEach(tab => {
        html += `<button data-tab="${tab.id}" class="tab-btn ${state.tab === tab.id ? 'active' : ''}">${tab.label}</button>`;
      });

      document.getElementById('nav-buttons').innerHTML = html;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.tab = btn.dataset.tab;
          renderNav();
          render();
        });
      });
    }

    function escape(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    function getTeamName(match, slot) {
      const teamId = slot === 1 ? match.team1_id : match.team2_id;
      const placeholder = slot === 1 ? match.placeholder1 : match.placeholder2;
      const team = state.teams.find(t => t.id === teamId);

      // Show placeholder if match is in semi/final stage and team not yet determined
      if ((match.stage === 'semi' || match.stage === 'final' || match.stage === 'third_place') && placeholder && !team?.name) {
        return placeholder;
      }
      return escape(team?.name || 'TBD');
    }

    function computeStandings(teams, matches, group) {
      const gt = teams.filter(t => t.group_name === group);
      const table = {};
      gt.forEach(t => table[t.id] = { team: t, pj: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0, pts: 0 });
      matches.filter(m => m.stage === 'group' && m.group_name === group && (m.played || (m.goals && m.goals.length > 0))).forEach(m => {
        const r1 = table[m.team1_id], r2 = table[m.team2_id];
        if (!r1 || !r2) return;
        // Calculate scores from goals if available, otherwise use score1/score2
        const score1 = m.goals ? (m.goals.filter(g => g.team_id === m.team1_id).length) : (m.score1 || 0);
        const score2 = m.goals ? (m.goals.filter(g => g.team_id === m.team2_id).length) : (m.score2 || 0);
        r1.pj++; r2.pj++;
        r1.gm += score1; r1.gs += score2;
        r2.gm += score2; r2.gs += score1;
        if (score1 > score2) { r1.v++; r1.pts += 3; r2.d++; }
        else if (score1 < score2) { r2.v++; r2.pts += 3; r1.d++; }
        else { r1.e++; r2.e++; r1.pts++; r2.pts++; }
      });
      const rows = Object.values(table);
      rows.forEach(r => r.gd = r.gm - r.gs);
      rows.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gm - a.gm);
      return rows;
    }

    function renderStandings() {
      const sa = computeStandings(state.teams, state.matches, 'A');
      const sb = computeStandings(state.teams, state.matches, 'B');
      let html = '<div class="card fade-in"><h2>📊 Classificação dos Grupos</h2><div class="groups-grid">';

      html += '<div><h3>Grupo A</h3>' + (sa.length ? '<table><thead><tr><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>Pts</th></tr></thead><tbody>' +
        sa.map(r => `<tr><td>${escape(r.team.name)}</td><td>${r.pj}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gm}</td><td>${r.gs}</td><td>${r.gd}</td><td><strong>${r.pts}</strong></td></tr>`).join('') +
        '</tbody></table>' : '<p class="empty-hint">Aguardando equipas...</p>') + '</div>';

      html += '<div><h3>Grupo B</h3>' + (sb.length ? '<table><thead><tr><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>Pts</th></tr></thead><tbody>' +
        sb.map(r => `<tr><td>${escape(r.team.name)}</td><td>${r.pj}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gm}</td><td>${r.gs}</td><td>${r.gd}</td><td><strong>${r.pts}</strong></td></tr>`).join('') +
        '</tbody></table>' : '<p class="empty-hint">Aguardando equipas...</p>') + '</div>';

      html += '</div></div>';
      return html;
    }

    function renderCalendar() {
      const ga = state.matches.filter(m => m.stage === 'group' && m.group_name === 'A');
      const gb = state.matches.filter(m => m.stage === 'group' && m.group_name === 'B');
      let html = '';

      if (ga.length) {
        html += '<div class="card fade-in"><h2>📅 Grupo A — Calendário</h2>';
        ga.forEach(m => {
          const score1 = (m.goals || []).filter(g => g.team_id === m.team1_id).length;
          const score2 = (m.goals || []).filter(g => g.team_id === m.team2_id).length;
          const hasGoals = score1 > 0 || score2 > 0;
          html += `<div class="match-card">
            <div class="match-teams">
              <span>${escape(m.team1?.name || 'TBD')}</span>
              <div class="score">${hasGoals || m.played ? score1 + '-' + score2 : 'vs'}</div>
              <span>${escape(m.team2?.name || 'TBD')}</span>
            </div>
            <div class="match-info">${m.scheduled_at ? new Date(m.scheduled_at).toLocaleString('pt-PT') : 'Data TBD'}</div>
          </div>`;
        });
        html += '</div>';
      }

      if (gb.length) {
        html += '<div class="card fade-in"><h2>📅 Grupo B — Calendário</h2>';
        gb.forEach(m => {
          const score1 = (m.goals || []).filter(g => g.team_id === m.team1_id).length;
          const score2 = (m.goals || []).filter(g => g.team_id === m.team2_id).length;
          const hasGoals = score1 > 0 || score2 > 0;
          html += `<div class="match-card">
            <div class="match-teams">
              <span>${escape(m.team1?.name || 'TBD')}</span>
              <div class="score">${hasGoals || m.played ? score1 + '-' + score2 : 'vs'}</div>
              <span>${escape(m.team2?.name || 'TBD')}</span>
            </div>
            <div class="match-info">${m.scheduled_at ? new Date(m.scheduled_at).toLocaleString('pt-PT') : 'Data TBD'}</div>
          </div>`;
        });
        html += '</div>';
      }

      return html || '<div class="card fade-in"><p class="empty-hint">Calendário em breve...</p></div>';
    }

    function renderBracket() {
      const semi1 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi1');
      const semi2 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi2');
      const final = state.matches.find(m => m.stage === 'final');
      const third = state.matches.find(m => m.stage === 'third_place');

      let html = '<div class="card fade-in"><h2>🏅 Fase Final</h2>';


      html += '<div class="groups-grid">';

      html += '<div><h3>Meias-Finais</h3>';
      if (semi1) {
        const semi1Score1 = (semi1.goals || []).filter(g => g.team_id === semi1.team1_id).length;
        const semi1Score2 = (semi1.goals || []).filter(g => g.team_id === semi1.team2_id).length;
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${getTeamName(semi1, 1)}</span>
            <div class="score">${semi1.played || (semi1.goals && semi1.goals.length > 0) ? semi1Score1 + '-' + semi1Score2 : 'vs'}</div>
            <span>${getTeamName(semi1, 2)}</span>
          </div>
        </div>`;
      }
      if (semi2) {
        const semi2Score1 = (semi2.goals || []).filter(g => g.team_id === semi2.team1_id).length;
        const semi2Score2 = (semi2.goals || []).filter(g => g.team_id === semi2.team2_id).length;
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${getTeamName(semi2, 1)}</span>
            <div class="score">${semi2.played || (semi2.goals && semi2.goals.length > 0) ? semi2Score1 + '-' + semi2Score2 : 'vs'}</div>
            <span>${getTeamName(semi2, 2)}</span>
          </div>
        </div>`;
      }
      if (!semi1 && !semi2) html += '<p class="empty-hint">A aguardar apuramento...</p>';
      html += '</div>';

      html += '<div><h3>Final & 3º Lugar</h3>';
      if (final) {
        const finalScore1 = (final.goals || []).filter(g => g.team_id === final.team1_id).length;
        const finalScore2 = (final.goals || []).filter(g => g.team_id === final.team2_id).length;
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${getTeamName(final, 1)}</span>
            <div class="score">${final.played || (final.goals && final.goals.length > 0) ? finalScore1 + '-' + finalScore2 : 'vs'}</div>
            <span>${getTeamName(final, 2)}</span>
          </div>
        </div>`;
      }
      if (third) {
        const thirdScore1 = (third.goals || []).filter(g => g.team_id === third.team1_id).length;
        const thirdScore2 = (third.goals || []).filter(g => g.team_id === third.team2_id).length;
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${getTeamName(third, 1)}</span>
            <div class="score">${third.played || (third.goals && third.goals.length > 0) ? thirdScore1 + '-' + thirdScore2 : 'vs'}</div>
            <span>${getTeamName(third, 2)}</span>
          </div>
        </div>`;
      }
      if (!final && !third) html += '<p class="empty-hint">A aguardar apuramento...</p>';
      html += '</div></div></div>';

      return html;
    }

    function renderScorers() {
      const counts = {};
      state.matches.forEach(m => {
        (m.goals || []).forEach(g => {
          if (!g.player_id || !g.players) return;
          if (!counts[g.player_id]) counts[g.player_id] = { player: g.players, goals: 0 };
          counts[g.player_id].goals++;
        });
      });
      const scorers = Object.values(counts).sort((a, b) => b.goals - a.goals);

      let html = '<div class="card fade-in"><h2>⚽ Melhores Marcadores</h2>';
      if (scorers.length) {
        html += '<div class="scorers-list">';
        scorers.forEach((s, i) => {
          html += `<div class="scorer-card"><div class="rank">#${i + 1}</div><div class="name">${escape(s.player.name)}</div><div class="goals">${s.goals}</div><div class="goals-label">golos</div></div>`;
        });
        html += '</div>';
      } else {
        html += '<p class="empty-hint">Sem golos registados ainda...</p>';
      }
      html += '</div>';
      return html;
    }

    function renderTeams() {
      let html = '<div class="card fade-in"><h2>👥 Equipas</h2>';
      ['A', 'B'].forEach(group => {
        const teams = state.teams.filter(t => t.group_name === group);
        if (!teams.length) return;
        html += `<h3>Grupo ${group}</h3>`;
        teams.forEach(t => {
          const players = t.players || [];
          html += `<div class="team-expand">
            <button class="team-toggle" onclick="toggleTeam('${t.id}')">
              <span>${escape(t.name)}</span>
              <span class="chevron" id="chevron-${t.id}">▾</span>
            </button>
            <div class="team-players" id="players-${t.id}">
              ${players.length ? players.map(p => `<div class="player-row">${escape(p.name)}</div>`).join('') : '<p class="empty-hint">Sem jogadores registados.</p>'}
            </div>
          </div>`;
        });
      });
      if (!state.teams.length) html += '<p class="empty-hint">Nenhuma equipa registada ainda.</p>';
      html += '</div>';
      return html;
    }

    function toggleTeam(id) {
      const panel = document.getElementById(`players-${id}`);
      const chevron = document.getElementById(`chevron-${id}`);
      if (!panel) return;
      const open = panel.classList.toggle('open');
      if (chevron) chevron.textContent = open ? '▴' : '▾';
    }

    async function renderAdmin() {
      if (!state.session) {
        let html = `<div class="login-box fade-in">
          <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <h2>Área Admin</h2>
          <div class="form-group"><label>Senha</label><input type="password" id="admin-pwd" placeholder="Insira a senha" /></div>
          <button onclick="adminLogin()">Entrar</button>
        </div>`;
        document.getElementById('content').innerHTML = html;
        return;
      }

      let html = '<div class="card fade-in"><h2>⚙️ Painel Admin</h2>';
      html += '<button class="btn-small btn-danger logout-btn" onclick="adminLogout()">Sair</button>';

      html += '<div class="admin-section"><h3>Adicionar Equipa</h3><div class="form-row"><input type="text" id="team-name" placeholder="Nome da equipa" /><select id="team-group"><option value="A">Grupo A</option><option value="B">Grupo B</option></select><button class="btn-small" onclick="addTeam()">Adicionar</button></div></div>';

      html += '<div class="admin-section"><h3>Equipas Registadas</h3>';
      if (state.teams.length) {
        state.teams.forEach(t => {
          html += `<div class="team-item"><div><strong>${escape(t.name)}</strong> (Grupo ${t.group_name})<br><small>${(t.players || []).map(p => escape(p.name)).join(', ')}</small></div><button class="btn-small btn-danger" onclick="deleteTeam('${t.id}')">Remover</button></div>`;
        });
      } else {
        html += '<p class="empty-hint">Sem equipas ainda</p>';
      }
      html += '</div>';

      html += '<div class="admin-section"><h3>Adicionar Jogador</h3><div class="form-row"><select id="team-sel"><option value="">Selecionar equipa</option>';
      state.teams.forEach(t => html += `<option value="${t.id}">${escape(t.name)}</option>`);
      html += '</select><input type="text" id="player-name" placeholder="Nome do jogador" /><button class="btn-small" onclick="addPlayer()">Adicionar</button></div></div>';

      html += `<div class="admin-section"><h3>⚽ Registar Golos em Tempo Real</h3>
        <p class="empty-hint" style="margin-bottom: 12px;">Selecione um jogo e clique nos jogadores para registar os golos. O score é calculado automaticamente.</p>`;

      const activeMatches = state.matches
        .filter(m => !m.played && (m.team1_id || m.placeholder1))
        .sort((a, b) => (a.scheduled_at || '').localeCompare(b.scheduled_at || ''));

      if (activeMatches.length) {
        html += '<div style="margin-bottom: 12px;"><label style="color: var(--gold-light); font-weight: 700;">Selecione um jogo:</label><div style="margin-top: 8px;">';
        activeMatches.forEach(m => {
          const date = m.scheduled_at ? new Date(m.scheduled_at).toLocaleString('pt-PT') : 'Data TBD';
          const team1Name = getTeamName(m, 1);
          const team2Name = getTeamName(m, 2);
          html += `<button class="btn-small" style="margin-bottom: 6px; width: 100%; text-align: left;" onclick="selectMatchForGoals('${m.id}')">${team1Name} vs ${team2Name} (${date})</button>`;
        });
        html += '</div></div>';
      } else {
        html += '<p class="empty-hint">Nenhum jogo ativo. Todos já foram finalizados!</p>';
      }

      html += `</div>`;
      html += `<div id="goals-panel" style="display: none;" class="admin-section"><h3>⚽ Registar Golos</h3><div id="goals-content"></div></div>`;

      html += `<div id="schedules-section" class="admin-section"><h3>Calendário de Grupos</h3>
        <p class="empty-hint" style="margin-bottom: 12px;">Os jogos da fase de grupos (todos contra todos) e da fase final são criados automaticamente. Defina apenas a hora de cada jogo em baixo.</p>
      </div>`;

      const stageLabels = { group: 'Grupo', semi: 'Meia-Final', third_place: '3º Lugar', final: 'Final' };
      html += '<div class="admin-section"><h3>Jogos e Horários</h3>';
      if (state.matches.length) {
        state.matches.forEach(m => {
          const stageLabel = stageLabels[m.stage] || m.stage;
          html += `<div class="team-item" style="flex-direction: column; align-items: flex-start;">
            <small style="opacity: 0.7;">${escape(stageLabel)}${m.stage === 'group' ? ' ' + escape(m.group_name || '') : ''}</small>
            <strong>${escape(m.team1?.name || 'TBD')} vs ${escape(m.team2?.name || 'TBD')}</strong>
            <div style="width: 100%; margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
              <input type="datetime-local" id="sched-${m.id}" value="${toLocalInputValue(m.scheduled_at)}" />
              <button class="btn-small" onclick="updateSchedule('${m.id}')">Guardar Data</button>
            </div>
            <div style="width: 100%; margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
              <button class="btn-small" onclick="selectMatchForGoals('${m.id}')">📊 Resultado: ${m.played ? m.score1 + '-' + m.score2 : 'VS'}</button>
              ${m.played ? `<button class="btn-small" style="background: linear-gradient(135deg, #d4af37, #f5dd8f);" onclick="clearAllGoals('${m.id}')">🗑️ Limpar Golos</button>` : ''}
              <button class="btn-small btn-danger" onclick="deleteMatch('${m.id}')">Remover</button>
            </div>
          </div>`;
        });
      } else {
        html += '<p class="empty-hint">Sem jogos ainda</p>';
      }
      html += '</div></div>';

      document.getElementById('content').innerHTML = html;
    }

    function render() {
      if (state.loading) {
        document.getElementById('content').innerHTML = '<div class="card fade-in"><p class="empty-hint">⏳ A carregar...</p></div>';
        return;
      }

      let html = '';
      switch(state.tab) {
        case 'standings': html = renderStandings(); break;
        case 'calendar': html = renderCalendar(); break;
        case 'bracket': html = renderBracket(); break;
        case 'scorers': html = renderScorers(); break;
        case 'teams': html = renderTeams(); break;
        case 'admin': renderAdmin(); return;
      }
      document.getElementById('content').innerHTML = html;
    }

    async function adminLogin() {
      const pwd = document.getElementById('admin-pwd')?.value;
      if (pwd !== ADMIN_PASSWORD) {
        alert('Senha incorreta');
        return;
      }
      try {
        await db.auth.signInWithPassword({ email: 'enzosantulhao7@gmail.com', password: 'Santulhao2026!Ouro' });
      } catch (e) {
        alert('Erro na autenticação');
      }
    }

    async function adminLogout() {
      await db.auth.signOut();
    }

    async function addTeam() {
      const name = document.getElementById('team-name')?.value;
      const group = document.getElementById('team-group')?.value;
      if (!name) return alert('Nome obrigatório');
      await db.from('teams').insert({ name, group_name: group });
      document.getElementById('team-name').value = '';
      await loadData();
      await generateGroupFixtures();
    }

    async function deleteTeam(id) {
      if (!confirm('Remover esta equipa?')) return;
      await db.from('teams').delete().eq('id', id);
      await loadData();
      renderAdmin();
    }

    async function addPlayer() {
      const teamId = document.getElementById('team-sel')?.value;
      const name = document.getElementById('player-name')?.value;
      if (!teamId || !name) return alert('Selecione a equipa e o nome');
      await db.from('players').insert({ team_id: teamId, name });
      document.getElementById('player-name').value = '';
      await loadData();
      renderAdmin();
    }

    async function saveResult(matchId) {
      const score1 = parseInt(document.getElementById(`score1-${matchId}`)?.value);
      const score2 = parseInt(document.getElementById(`score2-${matchId}`)?.value);
      if (isNaN(score1) || isNaN(score2)) return alert('Scores inválidos');
      await db.from('matches').update({ score1, score2, played: true }).eq('id', matchId);
      await loadData();
      renderAdmin();
    }

    async function clearResult(matchId) {
      if (!confirm('Remover o resultado e voltar a VS?')) return;
      await db.from('matches').update({ score1: null, score2: null, played: false }).eq('id', matchId);
      await loadData();
      renderAdmin();
    }

    function selectMatchForGoals(matchId) {
      // Store selected match for recovery after reload
      state.selectedMatchForGoals = matchId;

      const match = state.matches.find(m => m.id === matchId);
      if (!match || !match.team1_id || !match.team2_id) return;

      // Hide schedules section, show goals panel
      const schedulesSection = document.getElementById('schedules-section');
      if (schedulesSection) schedulesSection.style.display = 'none';
      document.getElementById('goals-panel').style.display = 'block';

      const team1 = state.teams.find(t => t.id === match.team1_id);
      const team2 = state.teams.find(t => t.id === match.team2_id);
      const currentGoals = state.matches.find(m => m.id === matchId)?.goals || [];

      const score1 = currentGoals.filter(g => g.team_id === match.team1_id).length;
      const score2 = currentGoals.filter(g => g.team_id === match.team2_id).length;

      let html = `<div style="margin-bottom: 16px;">
        <div style="text-align: center; margin-bottom: 16px; font-size: 1.3em; font-weight: 700;">
          <span style="color: var(--gold-light);">${escape(team1?.name || 'TBD')}</span>
          <span style="margin: 0 12px;">vs</span>
          <span style="color: var(--gold-light);">${escape(team2?.name || 'TBD')}</span>
        </div>
        <div style="text-align: center; margin-bottom: 20px;">
          <div style="font-size: 2.5em; font-weight: 900; color: var(--gold);">${score1} - ${score2}</div>
        </div>
      </div>`;

      html += `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">`;

      // Team 1 players
      html += `<div><h4 style="color: var(--gold-light); margin-bottom: 8px;">🟢 ${escape(team1?.name || 'Equipa 1')}</h4>`;
      if (team1?.players?.length) {
        team1.players.forEach(p => {
          const playerGoals = currentGoals.filter(g => g.player_id === p.id).length;
          html += `<button class="btn-small" style="width: 100%; margin-bottom: 6px; text-align: left; background: rgba(212, 175, 55, 0.2);" onclick="addGoal('${matchId}', '${p.id}', '${match.team1_id}')">${escape(p.name)} ${playerGoals > 0 ? `<span style="color: var(--gold);">(${playerGoals})</span>` : ''}</button>`;
        });
      } else {
        html += `<p class="empty-hint">Sem jogadores</p>`;
      }
      html += `</div>`;

      // Team 2 players
      html += `<div><h4 style="color: var(--gold-light); margin-bottom: 8px;">🔵 ${escape(team2?.name || 'Equipa 2')}</h4>`;
      if (team2?.players?.length) {
        team2.players.forEach(p => {
          const playerGoals = currentGoals.filter(g => g.player_id === p.id).length;
          html += `<button class="btn-small" style="width: 100%; margin-bottom: 6px; text-align: left; background: rgba(212, 175, 55, 0.2);" onclick="addGoal('${matchId}', '${p.id}', '${match.team2_id}')">${escape(p.name)} ${playerGoals > 0 ? `<span style="color: var(--gold);">(${playerGoals})</span>` : ''}</button>`;
        });
      } else {
        html += `<p class="empty-hint">Sem jogadores</p>`;
      }
      html += `</div>`;

      // Golos registados com opção de remover
      if (currentGoals.length) {
        html += `<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(212, 175, 55, 0.3);">
          <h4 style="color: var(--gold-light); margin-bottom: 8px;">⚽ Golos Registados (${currentGoals.length})</h4>`;
        currentGoals.forEach((g, idx) => {
          const player = state.teams.flatMap(t => t.players || []).find(p => p.id === g.player_id);
          html += `<div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: rgba(212, 175, 55, 0.1); margin-bottom: 4px; border-radius: 4px;">
            <span>${idx + 1}. ${escape(player?.name || 'Desconhecido')}</span>
            <button class="btn-small" style="padding: 4px 8px; font-size: 0.75em;" onclick="removeGoal('${g.id}', '${matchId}')">✕</button>
          </div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      html += `<div style="margin-top: 16px;"><button class="btn-small" style="width: 100%;" onclick="finishMatch('${matchId}', ${score1}, ${score2})">✅ Finalizar Jogo (${score1}-${score2})</button></div>`;
      html += `<div style="margin-top: 8px;"><button class="btn-small" style="width: 100%; background: linear-gradient(135deg, #d4af37, #f5dd8f); color: var(--green-950);" onclick="closeGoalsPanel()">← Voltar</button></div>`;

      document.getElementById('goals-panel').style.display = 'block';
      document.getElementById('goals-content').innerHTML = html;
    }

    async function addGoal(matchId, playerId, teamId) {
      await db.from('goals').insert({ match_id: matchId, player_id: playerId, team_id: teamId });
      // Don't do full loadData - just get goals for this match
      const { data: goals } = await db.from('goals').select('*').eq('match_id', matchId);
      const match = state.matches.find(m => m.id === matchId);
      if (match) match.goals = goals || [];
      // Restore panel
      selectMatchForGoals(matchId);
    }

    async function removeGoal(goalId, matchId) {
      await db.from('goals').delete().eq('id', goalId);
      // Just get updated goals for this match
      const { data: goals } = await db.from('goals').select('*').eq('match_id', matchId);
      const match = state.matches.find(m => m.id === matchId);
      if (match) match.goals = goals || [];
      // Keep panel open
      selectMatchForGoals(matchId);
    }

    async function clearAllGoals(matchId) {
      if (!confirm('Remover TODOS os golos deste jogo?')) return;
      await db.from('goals').delete().eq('match_id', matchId);
      await db.from('matches').update({ score1: null, score2: null, played: false }).eq('id', matchId);
      await loadData();
      closeGoalsPanel();
    }

    async function finishMatch(matchId, score1, score2) {
      await db.from('matches').update({ score1, score2, played: true }).eq('id', matchId);
      await loadData();
      closeGoalsPanel();

      // Auto-generate final if both semis are done
      const semi1 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi1');
      const semi2 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi2');
      const final = state.matches.find(m => m.stage === 'final');

      if (semi1 && semi2 && !final && (semi1.played || (semi1.goals && semi1.goals.length > 0)) && (semi2.played || (semi2.goals && semi2.goals.length > 0))) {
        await generateFinal();
      }
    }

    function closeGoalsPanel() {
      document.getElementById('goals-panel').style.display = 'none';
      const schedulesSection = document.getElementById('schedules-section');
      if (schedulesSection) schedulesSection.style.display = 'block';
    }

    function toLocalInputValue(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function generateGroupFixtures() {
      const existingPairs = new Set(
        state.matches.filter(m => m.stage === 'group').map(m => [m.team1_id, m.team2_id].sort().join('|'))
      );
      const toInsert = [];
      ['A', 'B'].forEach(group => {
        const teams = state.teams.filter(t => t.group_name === group);
        for (let i = 0; i < teams.length; i++) {
          for (let j = i + 1; j < teams.length; j++) {
            const pairKey = [teams[i].id, teams[j].id].sort().join('|');
            if (existingPairs.has(pairKey)) continue;
            toInsert.push({ stage: 'group', group_name: group, team1_id: teams[i].id, team2_id: teams[j].id });
          }
        }
      });
      if (toInsert.length) {
        await db.from('matches').insert(toInsert);
        await loadData();
      }
      renderAdmin();
    }

    async function generateSemis() {
      const sa = computeStandings(state.teams, state.matches, 'A');
      const sb = computeStandings(state.teams, state.matches, 'B');
      if (sa.length < 2 || sb.length < 2) return alert('É preciso pelo menos 2 equipas classificadas em cada grupo');
      await db.from('matches').insert([
        { stage: 'semi', semi_slot: 'semi1', team1_id: sa[0].team.id, team2_id: sb[1].team.id, placeholder1: '1º A', placeholder2: '2º B' },
        { stage: 'semi', semi_slot: 'semi2', team1_id: sb[0].team.id, team2_id: sa[1].team.id, placeholder1: '1º B', placeholder2: '2º A' }
      ]);
      await loadData();
      render();
    }

    async function generateFinal() {
      const semi1 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi1');
      const semi2 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi2');

      // Calculate scores from goals
      const semi1Score1 = (semi1?.goals || []).filter(g => g.team_id === semi1?.team1_id).length || 0;
      const semi1Score2 = (semi1?.goals || []).filter(g => g.team_id === semi1?.team2_id).length || 0;
      const semi2Score1 = (semi2?.goals || []).filter(g => g.team_id === semi2?.team1_id).length || 0;
      const semi2Score2 = (semi2?.goals || []).filter(g => g.team_id === semi2?.team2_id).length || 0;

      if (!semi1 || !semi2 || (semi1Score1 === 0 && semi1Score2 === 0) || (semi2Score1 === 0 && semi2Score2 === 0)) {
        return alert('As duas meias-finais têm de estar concluídas com resultados');
      }
      if (semi1Score1 === semi1Score2 || semi2Score1 === semi2Score2) {
        return alert('As meias-finais não podem terminar empatadas');
      }

      const winner1 = semi1Score1 > semi1Score2 ? semi1.team1_id : semi1.team2_id;
      const loser1 = semi1Score1 > semi1Score2 ? semi1.team2_id : semi1.team1_id;
      const winner2 = semi2Score1 > semi2Score2 ? semi2.team1_id : semi2.team2_id;
      const loser2 = semi2Score1 > semi2Score2 ? semi2.team2_id : semi2.team1_id;

      await db.from('matches').insert([
        { stage: 'final', team1_id: winner1, team2_id: winner2, placeholder1: 'Vencedor SF1', placeholder2: 'Vencedor SF2' },
        { stage: 'third_place', team1_id: loser1, team2_id: loser2, placeholder1: 'Perdedor SF1', placeholder2: 'Perdedor SF2' }
      ]);
      await loadData();
      render();
    }

    async function updateSchedule(matchId) {
      const dateVal = document.getElementById(`sched-${matchId}`)?.value;
      await db.from('matches').update({ scheduled_at: dateVal ? new Date(dateVal).toISOString() : null }).eq('id', matchId);
      await loadData();
      renderAdmin();
    }

    async function deleteMatch(id) {
      if (!confirm('Remover este jogo?')) return;
      await db.from('matches').delete().eq('id', id);
      await loadData();
      renderAdmin();
    }

    window.adminLogin = adminLogin;
    window.adminLogout = adminLogout;
    window.addTeam = addTeam;
    window.deleteTeam = deleteTeam;
    window.addPlayer = addPlayer;
    window.saveResult = saveResult;
    window.clearResult = clearResult;
    window.generateGroupFixtures = generateGroupFixtures;
    window.updateSchedule = updateSchedule;
    window.deleteMatch = deleteMatch;
    window.generateSemis = generateSemis;
    window.generateFinal = generateFinal;
    window.toggleTeam = toggleTeam;
    window.selectMatchForGoals = selectMatchForGoals;
    window.addGoal = addGoal;
    window.removeGoal = removeGoal;
    window.clearAllGoals = clearAllGoals;
    window.finishMatch = finishMatch;
    window.closeGoalsPanel = closeGoalsPanel;

    init();
  </script>
</body>
</html>
