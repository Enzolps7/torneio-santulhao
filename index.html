<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torneio de Santulhão 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-950: #051a13;
    --green-900: #0b3d2e;
    --green-800: #114d3a;
    --green-700: #17614a;
    --green-600: #1d7a5c;
    --gold: #d4af37;
    --gold-light: #f5dd8f;
    --gold-dim: #a3873a;
    --cream: #f5f0e1;
    --red: #b3382c;
    --font-display: 'Cinzel', serif;
    --font-body: 'Inter', 'Segoe UI', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: radial-gradient(circle at 50% 0%, #0d3527 0%, var(--green-950) 55%, #020c08 100%);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* subtle ambient particles */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 15% 20%, rgba(212,175,55,0.09), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(212,175,55,0.07), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(23,97,74,0.25), transparent 60%);
  }

  /* ===== SPLASH SCREEN ===== */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: radial-gradient(circle at 50% 40%, #0d3527 0%, var(--green-950) 60%, #020c08 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  #splash.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #splash .rays {
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(212,175,55,0.06) 8deg, transparent 16deg);
    animation: rotateRays 18s linear infinite;
  }

  @keyframes rotateRays {
    to { transform: rotate(360deg); }
  }

  .crest-wrap {
    position: relative;
    width: 180px;
    height: 175px;
    filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.45));
  }

  .crest-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.4) rotate(-10deg);
    animation: crestReveal 1s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes crestReveal {
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .splash-title {
    font-family: var(--font-display);
    font-weight: 900;
    letter-spacing: 6px;
    font-size: 1.7em;
    color: var(--gold-light);
    text-shadow: 0 4px 18px rgba(212,175,55,0.35);
    opacity: 0;
    animation: fadeUp 0.8s ease-out 1.5s forwards;
    text-align: center;
  }

  .splash-sub {
    font-family: var(--font-body);
    letter-spacing: 4px;
    font-size: 0.85em;
    color: var(--cream);
    opacity: 0;
    text-transform: uppercase;
    animation: fadeUp 0.8s ease-out 1.75s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .splash-bar {
    width: 180px;
    height: 3px;
    background: rgba(212,175,55,0.15);
    border-radius: 3px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 2s forwards;
  }

  .splash-bar::after {
    content: '';
    display: block;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-light), var(--gold-dim));
    animation: barSlide 1.1s ease-in-out infinite;
  }

  @keyframes barSlide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ===== HEADER ===== */
  header {
    position: relative;
    z-index: 1;
    background: linear-gradient(90deg, rgba(5, 26, 19, 0.9), rgba(17, 77, 58, 0.85));
    border-bottom: 1px solid rgba(212,175,55,0.5);
    padding: 22px 20px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    animation: slideDown 0.7s ease-out;
  }

  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .header-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo-blason {
    width: 62px;
    height: 60px;
    flex-shrink: 0;
    filter: drop-shadow(0 3px 10px rgba(212,175,55,0.4));
    animation: floatLogo 5s ease-in-out infinite;
  }

  .logo-blason img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  @keyframes floatLogo {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(-2deg); }
  }

  .header-text h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.7em;
    color: var(--gold-light);
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    letter-spacing: 2px;
  }

  .header-text p {
    color: var(--cream);
    font-size: 0.95em;
    opacity: 0.75;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* ===== NAV ===== */
  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(5, 20, 15, 0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 20px;
    border-bottom: 1px solid rgba(212,175,55,0.25);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  nav button {
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    border: 1.5px solid rgba(212, 175, 55, 0.55);
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.88em;
    font-weight: 700;
    letter-spacing: 0.6px;
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  nav button:hover {
    background: rgba(212, 175, 55, 0.15);
    border-color: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(212, 175, 55, 0.25);
  }

  nav button.active {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: var(--green-950);
    border-color: var(--gold-light);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(212, 175, 55, 0.45);
  }

  /* ===== MAIN ===== */
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  .fade-in { animation: fadeIn 0.6s ease-out; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(212, 175, 55, 0.28);
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 22px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  .card:hover {
    border-color: rgba(212, 175, 55, 0.55);
    box-shadow: 0 14px 45px rgba(212, 175, 55, 0.15);
  }

  .card h2 {
    font-family: var(--font-display);
    color: var(--gold-light);
    font-size: 1.4em;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    letter-spacing: 0.5px;
  }

  .card h3 {
    color: var(--gold-light);
    font-size: 1.1em;
    font-weight: 700;
    margin: 20px 0 14px;
    letter-spacing: 0.5px;
  }

  .groups-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  @media (max-width: 900px) {
    .groups-grid { grid-template-columns: 1fr; }
    .header-text h1 { font-size: 1.25em; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 0.92em;
  }

  thead { background: rgba(212, 175, 55, 0.1); }

  th {
    color: var(--gold);
    padding: 10px 8px;
    text-align: left;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.78em;
    letter-spacing: 0.5px;
    border-bottom: 2px solid rgba(212,175,55,0.5);
  }

  td { padding: 10px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  tbody tr { transition: background 0.2s ease; }
  tbody tr:hover { background: rgba(212, 175, 55, 0.06); }
  tbody tr:first-child td { color: var(--gold-light); font-weight: 700; }

  .match-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-left: 3px solid var(--gold-dim);
    border-radius: 10px;
    padding: 15px 18px;
    margin: 10px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    transition: all 0.25s ease;
  }

  .match-card:hover {
    background: rgba(212, 175, 55, 0.08);
    border-left-color: var(--gold);
    transform: translateX(4px);
  }

  .match-teams {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 15px;
    font-weight: 600;
    flex-wrap: wrap;
  }

  .score {
    background: var(--green-950);
    border: 1.5px solid var(--gold);
    color: var(--gold-light);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 1.15em;
    font-weight: 700;
    min-width: 70px;
    text-align: center;
  }

  .match-info {
    text-align: right;
    font-size: 0.85em;
    opacity: 0.7;
  }

  .login-box {
    max-width: 420px;
    margin: 40px auto;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 18px;
    padding: 40px 36px;
    backdrop-filter: blur(10px);
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
  }

  .login-box .lock-icon {
    width: 46px; height: 46px;
    margin: 0 auto 18px;
    color: var(--gold);
  }

  .login-box h2 {
    font-family: var(--font-display);
    color: var(--gold-light);
    margin-bottom: 24px;
    font-size: 1.5em;
    border: none;
    padding: 0;
  }

  .form-group { margin-bottom: 18px; text-align: left; }

  .form-group label {
    display: block;
    color: var(--gold-light);
    margin-bottom: 7px;
    font-weight: 600;
    font-size: 0.9em;
  }

  input, select, textarea {
    width: 100%;
    padding: 11px 14px;
    background: rgba(2, 12, 8, 0.55);
    border: 1.5px solid rgba(212, 175, 55, 0.35);
    border-radius: 8px;
    color: var(--cream);
    font-size: 0.95em;
    transition: all 0.25s ease;
    font-family: inherit;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18);
  }

  button {
    padding: 11px 22px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: var(--green-950);
    border: none;
    border-radius: 8px;
    font-size: 0.9em;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.25s ease;
    box-shadow: 0 5px 16px rgba(212, 175, 55, 0.25);
    font-family: var(--font-body);
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(212, 175, 55, 0.4);
  }

  button:active { transform: translateY(0); }

  .admin-section {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(212, 175, 55, 0.18);
    border-radius: 12px;
    padding: 20px;
    margin: 18px 0;
  }

  .form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .form-row input, .form-row select { flex: 1; min-width: 150px; }

  .team-item {
    background: rgba(212, 175, 55, 0.04);
    border: 1px solid rgba(212, 175, 55, 0.18);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .scorers-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .scorer-card {
    background: linear-gradient(160deg, rgba(212, 175, 55, 0.12), rgba(212,175,55,0.02));
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    transition: transform 0.25s ease;
  }

  .scorer-card:hover { transform: translateY(-3px); }

  .scorer-card .rank {
    font-size: 0.75em;
    color: var(--gold-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .scorer-card .name {
    color: var(--gold-light);
    font-weight: 700;
    font-size: 1.05em;
    margin: 6px 0;
  }

  .scorer-card .goals {
    color: var(--cream);
    font-size: 1.9em;
    font-weight: 800;
    font-family: var(--font-display);
  }

  .scorer-card .goals-label {
    font-size: 0.7em;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  footer {
    position: relative;
    z-index: 1;
    background: rgba(2, 12, 8, 0.5);
    border-top: 1px solid rgba(212,175,55,0.25);
    padding: 22px;
    text-align: center;
    color: var(--cream);
    font-size: 0.85em;
    opacity: 0.7;
    letter-spacing: 0.5px;
  }

  .empty-hint {
    color: var(--cream);
    font-style: italic;
    opacity: 0.6;
    padding: 24px;
    text-align: center;
  }

  .btn-small { padding: 8px 16px; font-size: 0.85em; width: auto; }
  .btn-danger { background: linear-gradient(135deg, var(--red), #c84242); }
  .logout-btn { width: auto; margin-bottom: 20px; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--green-950); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 10px; }
</style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- SPLASH / INTRO -->
  <div id="splash">
    <div class="rays"></div>
    <div class="crest-wrap">
      <img src="logo-santulhao.png" alt="Brasão de Santulhão" class="crest-img" />
    </div>
    <div class="splash-title">SANTULHÃO</div>
    <div class="splash-sub">Torneio 2026</div>
    <div class="splash-bar"></div>
  </div>

  <header>
    <div class="header-content">
      <div class="logo-blason">
        <img src="logo-santulhao.png" alt="Brasão de Santulhão" />
      </div>
      <div class="header-text">
        <h1>TORNEIO DE SANTULHÃO 2026</h1>
        <p>Santulhão · Portugal</p>
      </div>
    </div>
  </header>

  <nav>
    <div class="nav-container" id="nav-buttons"></div>
  </nav>

  <main id="content"></main>

  <footer>
    <p>Torneio de Santulhão 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabase, state = { session: null, teams: [], matches: [], tab: 'standings', loading: true };
    const ADMIN_PASSWORD = 'Santulhao.7';

    function hideSplash() {
      const splash = document.getElementById('splash');
      if (splash) splash.classList.add('hidden');
    }

    // Splash is purely decorative — always dismiss on its own timer,
    // completely independent of network/data loading so it can never hang.
    setTimeout(hideSplash, 2800);

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
      ]);
    }

    async function init() {
      // Render nav + a visible loading state immediately — never block the UI on the network.
      renderNav();
      render();

      let attempts = 0;
      while (!window.supabase && attempts < 20) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
      }

      if (!window.supabase) {
        state.loading = false;
        document.getElementById('content').innerHTML = '<div class="card"><p class="empty-hint">⚠ Erro ao carregar. Recarregue a página.</p></div>';
        return;
      }

      try {
        supabase = window.supabase.createClient(
          'https://bwseriegvtvjidbacwsa.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3c2VyaWVndnR2amlkYmFjd3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzQwOTEsImV4cCI6MjEwMTI1MDA5MX0.fiddoMRn4I0E8gXwd6FMsa25xBW4i-_w5MmTfyCw6Ac'
        );

        const session = await withTimeout(supabase.auth.getSession(), 8000);
        state.session = session.data.session;

        supabase.auth.onAuthStateChange((_evt, sess) => {
          state.session = sess;
          renderNav();
          render();
        });

        await withTimeout(loadData(), 8000);

        supabase.channel('changes')
          .on('postgres_changes', { event: '*', schema: 'public' }, () => loadData().then(render))
          .subscribe();
      } catch (e) {
        console.error('Erro ao inicializar:', e);
      } finally {
        state.loading = false;
        renderNav();
        render();
      }
    }

    async function loadData() {
      const [teams, matches] = await Promise.all([
        supabase.from('teams').select('*, players(*)').order('group_name').order('name'),
        supabase.from('matches').select('*, team1:team1_id(id,name,group_name), team2:team2_id(id,name,group_name), goals(id, player_id, team_id, players(id,name))').order('stage').order('scheduled_at', { ascending: true, nullsFirst: false })
      ]);
      state.teams = teams.data || [];
      state.matches = matches.data || [];
    }

    function renderNav() {
      const tabs = [
        { id: 'standings', label: '📊 Classificação' },
        { id: 'calendar', label: '📅 Calendário' },
        { id: 'bracket', label: '🏅 Fase Final' },
        { id: 'scorers', label: '⚽ Marcadores' },
        { id: 'admin', label: '🔐 Admin' }
      ];

      let html = '';
      tabs.forEach(tab => {
        html += `<button data-tab="${tab.id}" class="tab-btn ${state.tab === tab.id ? 'active' : ''}">${tab.label}</button>`;
      });

      document.getElementById('nav-buttons').innerHTML = html;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.tab = btn.dataset.tab;
          renderNav();
          render();
        });
      });
    }

    function escape(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    function computeStandings(teams, matches, group) {
      const gt = teams.filter(t => t.group_name === group);
      const table = {};
      gt.forEach(t => table[t.id] = { team: t, pj: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0, pts: 0 });
      matches.filter(m => m.stage === 'group' && m.group_name === group && m.played).forEach(m => {
        const r1 = table[m.team1_id], r2 = table[m.team2_id];
        if (!r1 || !r2) return;
        r1.pj++; r2.pj++;
        r1.gm += m.score1; r1.gs += m.score2;
        r2.gm += m.score2; r2.gs += m.score1;
        if (m.score1 > m.score2) { r1.v++; r1.pts += 3; r2.d++; }
        else if (m.score1 < m.score2) { r2.v++; r2.pts += 3; r1.d++; }
        else { r1.e++; r2.e++; r1.pts++; r2.pts++; }
      });
      const rows = Object.values(table);
      rows.forEach(r => r.gd = r.gm - r.gs);
      rows.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gm - a.gm);
      return rows;
    }

    function renderStandings() {
      const sa = computeStandings(state.teams, state.matches, 'A');
      const sb = computeStandings(state.teams, state.matches, 'B');
      let html = '<div class="card fade-in"><h2>📊 Classificação dos Grupos</h2><div class="groups-grid">';

      html += '<div><h3>Grupo A</h3>' + (sa.length ? '<table><thead><tr><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>Pts</th></tr></thead><tbody>' +
        sa.map(r => `<tr><td>${escape(r.team.name)}</td><td>${r.pj}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gm}</td><td>${r.gs}</td><td>${r.gd}</td><td><strong>${r.pts}</strong></td></tr>`).join('') +
        '</tbody></table>' : '<p class="empty-hint">Aguardando equipas...</p>') + '</div>';

      html += '<div><h3>Grupo B</h3>' + (sb.length ? '<table><thead><tr><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>Pts</th></tr></thead><tbody>' +
        sb.map(r => `<tr><td>${escape(r.team.name)}</td><td>${r.pj}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gm}</td><td>${r.gs}</td><td>${r.gd}</td><td><strong>${r.pts}</strong></td></tr>`).join('') +
        '</tbody></table>' : '<p class="empty-hint">Aguardando equipas...</p>') + '</div>';

      html += '</div></div>';
      return html;
    }

    function renderCalendar() {
      const ga = state.matches.filter(m => m.stage === 'group' && m.group_name === 'A');
      const gb = state.matches.filter(m => m.stage === 'group' && m.group_name === 'B');
      let html = '';

      if (ga.length) {
        html += '<div class="card fade-in"><h2>📅 Grupo A — Calendário</h2>';
        ga.forEach(m => {
          html += `<div class="match-card">
            <div class="match-teams">
              <span>${escape(m.team1?.name || 'TBD')}</span>
              <div class="score">${m.played ? m.score1 + '-' + m.score2 : 'vs'}</div>
              <span>${escape(m.team2?.name || 'TBD')}</span>
            </div>
            <div class="match-info">${m.scheduled_at ? new Date(m.scheduled_at).toLocaleString('pt-PT') : 'Data TBD'}</div>
          </div>`;
        });
        html += '</div>';
      }

      if (gb.length) {
        html += '<div class="card fade-in"><h2>📅 Grupo B — Calendário</h2>';
        gb.forEach(m => {
          html += `<div class="match-card">
            <div class="match-teams">
              <span>${escape(m.team1?.name || 'TBD')}</span>
              <div class="score">${m.played ? m.score1 + '-' + m.score2 : 'vs'}</div>
              <span>${escape(m.team2?.name || 'TBD')}</span>
            </div>
            <div class="match-info">${m.scheduled_at ? new Date(m.scheduled_at).toLocaleString('pt-PT') : 'Data TBD'}</div>
          </div>`;
        });
        html += '</div>';
      }

      return html || '<div class="card fade-in"><p class="empty-hint">Calendário em breve...</p></div>';
    }

    function renderBracket() {
      const semi1 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi1');
      const semi2 = state.matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi2');
      const final = state.matches.find(m => m.stage === 'final');
      const third = state.matches.find(m => m.stage === 'third_place');

      let html = '<div class="card fade-in"><h2>🏅 Fase Final</h2>';
      html += '<div class="groups-grid">';

      html += '<div><h3>Meias-Finais</h3>';
      if (semi1) {
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${escape(semi1.team1?.name || 'TBD')}</span>
            <div class="score">${semi1.played ? semi1.score1 + '-' + semi1.score2 : 'vs'}</div>
            <span>${escape(semi1.team2?.name || 'TBD')}</span>
          </div>
        </div>`;
      }
      if (semi2) {
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${escape(semi2.team1?.name || 'TBD')}</span>
            <div class="score">${semi2.played ? semi2.score1 + '-' + semi2.score2 : 'vs'}</div>
            <span>${escape(semi2.team2?.name || 'TBD')}</span>
          </div>
        </div>`;
      }
      if (!semi1 && !semi2) html += '<p class="empty-hint">A aguardar apuramento...</p>';
      html += '</div>';

      html += '<div><h3>Final & 3º Lugar</h3>';
      if (final) {
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${escape(final.team1?.name || 'TBD')}</span>
            <div class="score">${final.played ? final.score1 + '-' + final.score2 : 'vs'}</div>
            <span>${escape(final.team2?.name || 'TBD')}</span>
          </div>
        </div>`;
      }
      if (third) {
        html += `<div class="match-card">
          <div class="match-teams">
            <span>${escape(third.team1?.name || 'TBD')}</span>
            <div class="score">${third.played ? third.score1 + '-' + third.score2 : 'vs'}</div>
            <span>${escape(third.team2?.name || 'TBD')}</span>
          </div>
        </div>`;
      }
      if (!final && !third) html += '<p class="empty-hint">A aguardar apuramento...</p>';
      html += '</div></div></div>';

      return html;
    }

    function renderScorers() {
      const counts = {};
      state.matches.forEach(m => {
        (m.goals || []).forEach(g => {
          if (!g.player_id || !g.players) return;
          if (!counts[g.player_id]) counts[g.player_id] = { player: g.players, goals: 0 };
          counts[g.player_id].goals++;
        });
      });
      const scorers = Object.values(counts).sort((a, b) => b.goals - a.goals);

      let html = '<div class="card fade-in"><h2>⚽ Melhores Marcadores</h2>';
      if (scorers.length) {
        html += '<div class="scorers-list">';
        scorers.forEach((s, i) => {
          html += `<div class="scorer-card"><div class="rank">#${i + 1}</div><div class="name">${escape(s.player.name)}</div><div class="goals">${s.goals}</div><div class="goals-label">golos</div></div>`;
        });
        html += '</div>';
      } else {
        html += '<p class="empty-hint">Sem golos registados ainda...</p>';
      }
      html += '</div>';
      return html;
    }

    async function renderAdmin() {
      if (!state.session) {
        let html = `<div class="login-box fade-in">
          <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <h2>Área Admin</h2>
          <div class="form-group"><label>Senha</label><input type="password" id="admin-pwd" placeholder="Insira a senha" /></div>
          <button onclick="adminLogin()">Entrar</button>
        </div>`;
        document.getElementById('content').innerHTML = html;
        return;
      }

      let html = '<div class="card fade-in"><h2>⚙️ Painel Admin</h2>';
      html += '<button class="btn-small btn-danger logout-btn" onclick="adminLogout()">Sair</button>';

      html += '<div class="admin-section"><h3>Adicionar Equipa</h3><div class="form-row"><input type="text" id="team-name" placeholder="Nome da equipa" /><select id="team-group"><option value="A">Grupo A</option><option value="B">Grupo B</option></select><button class="btn-small" onclick="addTeam()">Adicionar</button></div></div>';

      html += '<div class="admin-section"><h3>Equipas Registadas</h3>';
      if (state.teams.length) {
        state.teams.forEach(t => {
          html += `<div class="team-item"><div><strong>${escape(t.name)}</strong> (Grupo ${t.group_name})<br><small>${(t.players || []).map(p => escape(p.name)).join(', ')}</small></div><button class="btn-small btn-danger" onclick="deleteTeam('${t.id}')">Remover</button></div>`;
        });
      } else {
        html += '<p class="empty-hint">Sem equipas ainda</p>';
      }
      html += '</div>';

      html += '<div class="admin-section"><h3>Adicionar Jogador</h3><div class="form-row"><select id="team-sel"><option value="">Selecionar equipa</option>';
      state.teams.forEach(t => html += `<option value="${t.id}">${escape(t.name)}</option>`);
      html += '</select><input type="text" id="player-name" placeholder="Nome do jogador" /><button class="btn-small" onclick="addPlayer()">Adicionar</button></div></div>';

      html += '<div class="admin-section"><h3>Resultados</h3>';
      if (state.matches.length) {
        state.matches.forEach(m => {
          html += `<div class="team-item" style="flex-direction: column; align-items: flex-start;">
            <strong>${escape(m.team1?.name || 'TBD')} vs ${escape(m.team2?.name || 'TBD')}</strong>
            <div style="width: 100%; margin-top: 10px; display: flex; gap: 10px;">
              <input type="number" min="0" id="score1-${m.id}" value="${m.score1 || ''}" placeholder="Golos 1" />
              <input type="number" min="0" id="score2-${m.id}" value="${m.score2 || ''}" placeholder="Golos 2" />
              <button class="btn-small" onclick="saveResult('${m.id}')">Guardar</button>
            </div>
          </div>`;
        });
      } else {
        html += '<p class="empty-hint">Sem jogos ainda</p>';
      }
      html += '</div></div>';

      document.getElementById('content').innerHTML = html;
    }

    function render() {
      if (state.loading) {
        document.getElementById('content').innerHTML = '<div class="card fade-in"><p class="empty-hint">⏳ A carregar...</p></div>';
        return;
      }

      let html = '';
      switch(state.tab) {
        case 'standings': html = renderStandings(); break;
        case 'calendar': html = renderCalendar(); break;
        case 'bracket': html = renderBracket(); break;
        case 'scorers': html = renderScorers(); break;
        case 'admin': renderAdmin(); return;
      }
      document.getElementById('content').innerHTML = html;
    }

    async function adminLogin() {
      const pwd = document.getElementById('admin-pwd')?.value;
      if (pwd !== ADMIN_PASSWORD) {
        alert('Senha incorreta');
        return;
      }
      try {
        await supabase.auth.signInWithPassword({ email: 'enzosantulhao7@gmail.com', password: 'Santulhao2026!Ouro' });
      } catch (e) {
        alert('Erro na autenticação');
      }
    }

    async function adminLogout() {
      await supabase.auth.signOut();
    }

    async function addTeam() {
      const name = document.getElementById('team-name')?.value;
      const group = document.getElementById('team-group')?.value;
      if (!name) return alert('Nome obrigatório');
      await supabase.from('teams').insert({ name, group_name: group });
      document.getElementById('team-name').value = '';
      await loadData();
      renderAdmin();
    }

    async function deleteTeam(id) {
      if (!confirm('Remover esta equipa?')) return;
      await supabase.from('teams').delete().eq('id', id);
      await loadData();
      renderAdmin();
    }

    async function addPlayer() {
      const teamId = document.getElementById('team-sel')?.value;
      const name = document.getElementById('player-name')?.value;
      if (!teamId || !name) return alert('Selecione a equipa e o nome');
      await supabase.from('players').insert({ team_id: teamId, name });
      document.getElementById('player-name').value = '';
      await loadData();
      renderAdmin();
    }

    async function saveResult(matchId) {
      const score1 = parseInt(document.getElementById(`score1-${matchId}`)?.value);
      const score2 = parseInt(document.getElementById(`score2-${matchId}`)?.value);
      if (isNaN(score1) || isNaN(score2)) return alert('Scores inválidos');
      await supabase.from('matches').update({ score1, score2, played: true }).eq('id', matchId);
      await loadData();
      renderAdmin();
    }

    window.adminLogin = adminLogin;
    window.adminLogout = adminLogout;
    window.addTeam = addTeam;
    window.deleteTeam = deleteTeam;
    window.addPlayer = addPlayer;
    window.saveResult = saveResult;

    init();
  </script>
</body>
</html>
