<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torneio de Santulhão 2026</title>
    <style>
      :root {
        --green-950: #06231a;
        --green-900: #0b3d2e;
        --green-800: #114d3a;
        --green-700: #17614a;
        --gold: #d4af37;
        --gold-light: #f0d878;
        --cream: #f5f0e1;
        --red: #b3382c;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: linear-gradient(180deg, var(--green-950), var(--green-900) 40%, var(--green-950)); color: var(--cream); min-height: 100vh; }
      header.site-header { padding: 22px 16px 14px; text-align: center; border-bottom: 2px solid var(--gold); background: rgba(0, 0, 0, 0.15); }
      header.site-header h1 { margin: 0; color: var(--gold-light); font-size: 1.7rem; letter-spacing: 0.5px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
      header.site-header p { margin: 4px 0 0; color: var(--cream); opacity: 0.8; font-size: 0.9rem; }
      nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 14px 10px; }
      nav.tabs button { background: var(--green-800); color: var(--cream); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 0.9rem; transition: 0.15s; }
      nav.tabs button:hover { background: var(--green-700); }
      nav.tabs button.active { background: var(--gold); color: var(--green-950); font-weight: 700; border-color: var(--gold-light); }
      main { max-width: 980px; margin: 0 auto; padding: 10px 14px 60px; }
      .card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; }
      .card h2 { margin-top: 0; color: var(--gold-light); font-size: 1.15rem; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 8px; }
      .card h3 { color: var(--gold-light); margin: 12px 0 8px; }
      .groups-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
      @media (min-width: 720px) { .groups-grid { grid-template-columns: 1fr 1fr; } }
      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      th, td { padding: 6px 6px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
      th { color: var(--gold-light); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
      td:first-child, th:first-child { text-align: left; }
      tr.rank-1 td:first-child, tr.rank-2 td:first-child { color: var(--gold-light); font-weight: 700; }
      .match-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-wrap: wrap; }
      .match-row:last-child { border-bottom: none; }
      .match-teams { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
      .match-teams .team { flex: 1; font-weight: 600; }
      .match-teams .team.right { text-align: right; }
      .score-badge { background: var(--green-950); border: 1px solid var(--gold); color: var(--gold-light); font-weight: 700; padding: 4px 10px; border-radius: 6px; min-width: 56px; text-align: center; }
      .match-meta { font-size: 0.78rem; opacity: 0.75; min-width: 150px; text-align: right; }
      .scorers-line { width: 100%; font-size: 0.78rem; opacity: 0.85; padding-left: 4px; color: var(--gold-light); }
      .bracket { display: flex; flex-direction: column; gap: 22px; }
      .bracket-round h3 { color: var(--gold-light); font-size: 0.95rem; margin: 0 0 8px; }
      .bracket-matches { display: grid; gap: 12px; grid-template-columns: 1fr; }
      @media (min-width: 720px) { .bracket-matches.two-col { grid-template-columns: 1fr 1fr; } }
      .scorers-table td:first-child { font-weight: 600; }
      .scorers-table .rank { color: var(--gold-light); font-weight: 700; }
      button.btn { background: var(--gold); color: var(--green-950); border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
      button.btn:hover { background: var(--gold-light); }
      button.btn.secondary { background: transparent; color: var(--gold-light); border: 1px solid var(--gold); }
      button.btn.danger { background: var(--red); color: var(--cream); }
      input, select { background: var(--green-950); border: 1px solid rgba(212, 175, 55, 0.5); color: var(--cream); padding: 7px 9px; border-radius: 6px; font-size: 0.9rem; }
      form.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      .admin-team-block { border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
      .admin-team-block h3 { margin: 0 0 8px; color: var(--gold-light); display: flex; justify-content: space-between; align-items: center; }
      .player-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--green-800); border: 1px solid rgba(212, 175, 55, 0.4); padding: 3px 8px; border-radius: 999px; font-size: 0.8rem; margin: 3px 4px 3px 0; }
      .player-chip button { background: none; border: none; color: var(--red); cursor: pointer; font-weight: 700; padding: 0; }
      .login-box { max-width: 340px; margin: 40px auto; }
      .login-box input { width: 100%; margin-bottom: 10px; }
      .error-msg { color: #ff8f7a; font-size: 0.85rem; margin-top: 6px; }
      .result-form { display: grid; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(212, 175, 55, 0.3); }
      .result-form .score-inputs { display: flex; align-items: center; gap: 8px; }
      .result-form .score-inputs input { width: 56px; text-align: center; }
      .goal-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      footer { text-align: center; opacity: 0.6; font-size: 0.78rem; padding: 20px; }
      .badge-live { display: inline-block; background: var(--gold); color: var(--green-950); font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
      .empty-hint { opacity: 0.7; font-style: italic; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      async function init() {
        // Attendre que Supabase soit disponible
        let attempts = 0;
        while (!window.supabase && attempts < 20) {
          await new Promise(r => setTimeout(r, 100));
          attempts++;
        }

        if (!window.supabase) {
          document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;">Erreur: Supabase ne s\'a pas chargé.<br>Status: ' + (window.supabase ? 'OK' : 'FAIL') + '<br><button onclick="location.reload()">Rafraîchir</button></div>';
          return;
        }

        const supabase = window.supabase.createClient(
          'https://bwseriegvtvjidbacwsa.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3c2VyaWVndnR2amlkYmFjd3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzQwOTEsImV4cCI6MjEwMTI1MDA5MX0.fiddoMRn4I0E8gXwd6FMsa25xBW4i-_w5MmTfyCw6Ac'
        );

        const app = document.getElementById('app');
        const state = { session: null, teams: [], matches: [], tab: 'standings', loading: true };

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        function teamLabel(team) {
          return team ? escapeHtml(team.name) : 'Por definir';
        }

        function formatDateTime(iso) {
          if (!iso) return 'Data por marcar';
          const d = new Date(iso);
          return d.toLocaleString('pt-PT', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function computeStandings(teams, matches, groupName) {
          const groupTeams = teams.filter(t => t.group_name === groupName);
          const table = {};
          for (const t of groupTeams) {
            table[t.id] = { team: t, pj: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0, gd: 0, pts: 0 };
          }
          const groupMatches = matches.filter(m => m.stage === 'group' && m.group_name === groupName && m.played);
          for (const m of groupMatches) {
            const r1 = table[m.team1_id], r2 = table[m.team2_id];
            if (!r1 || !r2) continue;
            r1.pj++; r2.pj++;
            r1.gm += m.score1; r1.gs += m.score2;
            r2.gm += m.score2; r2.gs += m.score1;
            if (m.score1 > m.score2) { r1.v++; r1.pts += 3; r2.d++; }
            else if (m.score1 < m.score2) { r2.v++; r2.pts += 3; r1.d++; }
            else { r1.e++; r2.e++; r1.pts += 1; r2.pts += 1; }
          }
          const rows = Object.values(table);
          rows.forEach(r => r.gd = r.gm - r.gs);
          rows.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gm - a.gm || a.team.name.localeCompare(b.team.name));
          return rows;
        }

        function computeTopScorers(matches) {
          const counts = {};
          for (const m of matches) {
            for (const g of (m.goals || [])) {
              if (!g.player_id || !g.players) continue;
              if (!counts[g.player_id]) counts[g.player_id] = { player: g.players, teamId: g.team_id, goals: 0 };
              counts[g.player_id].goals++;
            }
          }
          return Object.values(counts).sort((a, b) => b.goals - a.goals || a.player.name.localeCompare(b.player.name));
        }

        function standingsTable(rows, groupName) {
          if (rows.length === 0) return `<p class="empty-hint">Ainda sem equipas no Grupo ${groupName}.</p>`;
          const trs = rows.map((r, i) => `<tr class="${i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : ''}"><td>${escapeHtml(r.team.name)}</td><td>${r.pj}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gm}</td><td>${r.gs}</td><td>${r.gd}</td><td><strong>${r.pts}</strong></td></tr>`).join('');
          return `<table><thead><tr><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>Pts</th></tr></thead><tbody>${trs}</tbody></table>`;
        }

        function renderStandings(teams, matches) {
          const standingsA = computeStandings(teams, matches, 'A');
          const standingsB = computeStandings(teams, matches, 'B');
          return `<div class="card"><h2>Classificação</h2><div class="groups-grid"><div><h3>Grupo A</h3>${standingsTable(standingsA, 'A')}</div><div><h3>Grupo B</h3>${standingsTable(standingsB, 'B')}</div></div><p class="empty-hint" style="margin-top:10px;">O 1º de cada grupo defronta o 2º do grupo adversário nas meias-finais.</p></div>`;
        }

        function matchRow(m) {
          const scoreHtml = m.played ? `<span class="score-badge">${m.score1} - ${m.score2}</span>` : `<span class="score-badge">vs</span>`;
          const scorers = (m.goals || []).map(g => g.players ? g.players.name : null).filter(Boolean);
          const scorersLine = scorers.length ? `<div class="scorers-line">⚽ ${scorers.map(escapeHtml).join(', ')}</div>` : '';
          return `<div class="match-row"><div class="match-teams"><span class="team">${teamLabel(m.team1)}</span>${scoreHtml}<span class="team right">${teamLabel(m.team2)}</span></div><div class="match-meta">${formatDateTime(m.scheduled_at)}${m.venue ? ' · ' + escapeHtml(m.venue) : ''}</div>${scorersLine}</div>`;
        }

        function renderCalendar(matches) {
          const groupA = matches.filter(m => m.stage === 'group' && m.group_name === 'A');
          const groupB = matches.filter(m => m.stage === 'group' && m.group_name === 'B');
          return `${groupA.length ? `<div class="card"><h2>Grupo A — Calendário</h2>${groupA.map(matchRow).join('')}</div>` : `<div class="card"><h2>Grupo A — Calendário</h2><p class="empty-hint">Calendário gerado assim que o grupo tiver 4 equipas.</p></div>`}${groupB.length ? `<div class="card"><h2>Grupo B — Calendário</h2>${groupB.map(matchRow).join('')}</div>` : `<div class="card"><h2>Grupo B — Calendário</h2><p class="empty-hint">Calendário gerado assim que o grupo tiver 4 equipas.</p></div>`}`;
        }

        function renderBracket(matches) {
          const semi1 = matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi1');
          const semi2 = matches.find(m => m.stage === 'semi' && m.semi_slot === 'semi2');
          const final = matches.find(m => m.stage === 'final');
          const third = matches.find(m => m.stage === 'third_place');
          const box = (m, label) => m ? `<div class="card">${matchRow(m)}</div>` : `<div class="card"><p class="empty-hint">${label}</p></div>`;
          return `<div class="card"><h2>Fase Final</h2><div class="bracket"><div class="bracket-round"><h3>Meias-Finais</h3><div class="bracket-matches two-col">${box(semi1, '1º Grupo A vs 2º Grupo B — a definir')}${box(semi2, '1º Grupo B vs 2º Grupo A — a definir')}</div></div><div class="bracket-round"><h3>3º Lugar &amp; Final</h3><div class="bracket-matches two-col">${box(third, 'Vencidos das meias-finais — a definir')}${box(final, 'Vencedores das meias-finais — a definir')}</div></div></div></div>`;
        }

        function renderScorers(matches) {
          const scorers = computeTopScorers(matches);
          if (scorers.length === 0) return `<div class="card"><h2>Melhores Marcadores</h2><p class="empty-hint">Ainda não há golos registados.</p></div>`;
          const trs = scorers.map((s, i) => `<tr><td class="rank">${i + 1}º</td><td>${escapeHtml(s.player.name)}</td><td><strong>${s.goals}</strong></td></tr>`).join('');
          return `<div class="card"><h2>Melhores Marcadores</h2><table class="scorers-table"><thead><tr><th></th><th>Jogador</th><th>Golos</th></tr></thead><tbody>${trs}</tbody></table></div>`;
        }

        function renderLogin(errorMsg) {
          return `<div class="card login-box"><h2>Área de Administração</h2><form data-action="login-form"><input type="email" id="login-email" placeholder="Email" required autocomplete="username" /><input type="password" id="login-password" placeholder="Palavra-passe" required autocomplete="current-password" /><button class="btn" type="submit" style="width:100%;">Entrar</button>${errorMsg ? `<p class="error-msg">${escapeHtml(errorMsg)}</p>` : ''}</form></div>`;
        }

        function renderNav() {
          const tabs = state.session
            ? [{ id: 'standings', label: 'Classificação' }, { id: 'calendar', label: 'Calendário' }, { id: 'bracket', label: 'Fase Final' }, { id: 'scorers', label: 'Marcadores' }, { id: 'admin-teams', label: 'Equipas' }, { id: 'admin-schedule', label: 'Horários' }, { id: 'admin-results', label: 'Resultados' }]
            : [{ id: 'standings', label: 'Classificação' }, { id: 'calendar', label: 'Calendário' }, { id: 'bracket', label: 'Fase Final' }, { id: 'scorers', label: 'Marcadores' }];
          const buttons = tabs.map(t => `<button data-action="tab" data-tab="${t.id}" class="${state.tab === t.id ? 'active' : ''}">${t.label}</button>`).join('');
          const authButton = state.session ? `<button data-action="logout">Sair</button>` : `<button data-action="tab" data-tab="login" class="${state.tab === 'login' ? 'active' : ''}">Admin</button>`;
          return `<nav class="tabs">${buttons}${authButton}</nav>`;
        }

        function renderContent() {
          if (state.loading) return `<div class="card"><p class="empty-hint">A carregar...</p></div>`;
          switch (state.tab) {
            case 'standings': return renderStandings(state.teams, state.matches);
            case 'calendar': return renderCalendar(state.matches);
            case 'bracket': return renderBracket(state.matches);
            case 'scorers': return renderScorers(state.matches);
            case 'login': return state.session ? renderStandings(state.teams, state.matches) : renderLogin(state.loginError || '');
            default: return renderStandings(state.teams, state.matches);
          }
        }

        function render() {
          app.innerHTML = `
            <header class="site-header">
              <h1>🏆 Torneio de Santulhão 2026</h1>
              <p>Santulhão · Portugal</p>
            </header>
            ${renderNav()}
            <main>${renderContent()}</main>
            <footer>Torneio de Santulhão 2026</footer>
          `;
        }

        async function loadData() {
          try {
            const [teams, matches] = await Promise.all([
              supabase.from('teams').select('*, players(*)').order('group_name').order('name'),
              supabase.from('matches').select('*, team1:team1_id(id,name,group_name), team2:team2_id(id,name,group_name), goals(id, player_id, team_id, players(id,name))').order('stage').order('scheduled_at', { ascending: true, nullsFirst: false })
            ]);
            state.teams = teams.data || [];
            state.matches = matches.data || [];
          } catch (err) {
            console.error('Erro ao carregar dados:', err);
          }
        }

        app.addEventListener('click', async (e) => {
          const el = e.target.closest('[data-action]');
          if (!el) return;
          const action = el.dataset.action;
          if (action === 'tab') {
            state.tab = el.dataset.tab;
            render();
          } else if (action === 'logout') {
            await supabase.auth.signOut();
            state.session = null;
            state.tab = 'standings';
            render();
          }
        });

        app.addEventListener('submit', async (e) => {
          const form = e.target.closest('[data-action]');
          if (!form) return;
          e.preventDefault();
          if (form.dataset.action === 'login-form') {
            const email = form.querySelector('#login-email').value.trim();
            const password = form.querySelector('#login-password').value;
            try {
              await supabase.auth.signInWithPassword({ email, password });
              state.session = await supabase.auth.getSession();
              state.session = state.session.data.session;
              state.loginError = null;
              state.tab = 'standings';
              await loadData();
              render();
            } catch (err) {
              state.loginError = 'Credenciais inválidas.';
              render();
            }
          }
        });

        await loadData();
        state.loading = false;
        render();

        supabase.channel('public-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, () => loadData().then(render))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, () => loadData().then(render))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'goals' }, () => loadData().then(render))
          .subscribe();
      }
      init();
    </script>
  </body>
</html>
